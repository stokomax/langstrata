services:
  # ── Shared infrastructure ──────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
    volumes:
      - ./docker-init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Supervisor server ──────────────────────────────────────────
  supervisor:
    build:
      context: .
      dockerfile: supervisor.Dockerfile
    ports:
      - "8123:8123"
    env_file:
      - .env
    environment:
      PORT: "8123"
      DATABASE_URI: "postgres://langgraph:langgraph@postgres:5432/langgraph?sslmode=disable"
      REDIS_URI: "redis://redis:6379/0"
      AGENT_SERVER_MODE: "http"
      AGENT_SERVER_WORKER_API_URL: "http://worker:8124"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker server ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    ports:
      - "8124:8124"
    env_file:
      - .env
    environment:
      PORT: "8124"
      DATABASE_URI: "postgres://langgraph:langgraph@postgres:5432/langgraph_workers?sslmode=disable"
      REDIS_URI: "redis://redis:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
